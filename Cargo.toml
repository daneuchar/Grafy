[workspace]
resolver = "2"
members = [
    "crates/grafy",
    "crates/grafy-parser",
    "crates/grafy-stackgraphs",
    "crates/grafy-bench",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/daneuchar/Grafy"
homepage = "https://github.com/daneuchar/Grafy"
authors = ["Daniel Euchar <daneuchar@gmail.com>"]

[workspace.dependencies]
# Parsing — M0 + M1 W1. All grammars aligned to tree-sitter 0.23 line.
tree-sitter = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "=0.23.1"
tree-sitter-php = "0.23"
tree-sitter-scala = "0.23"
tree-sitter-lua = "0.2"

# Concurrency
rayon = "1"
crossbeam-channel = "0.5"
dashmap = "6"

# Storage
redb = "2"
postcard = { version = "1", features = ["alloc"] }

# FS walking + hashing
ignore = "0.4"
blake3 = "1"

# Observability — wired from commit 1
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pattern matching — used by MCP search_graph and search_code tool handlers
regex = "1"

# Test utilities
tempfile = "3"

# Faster allocator — Tier 1 perf
mimalloc = { version = "0.1", default-features = false }

# rmcp — M1 W5. Pin 1.7.0 (latest stable as of 2026-05).
# Uses server + macros features (stdio transport, #[tool] macros).
# No client/HTTP/auth features pulled in — keeps the dep footprint minimal.
# 1.x requires tree-sitter 0.23-compatible tokio ≥ 1.28; confirmed compatible.
rmcp = { version = "1.7.0", default-features = false, features = ["server", "macros", "transport-io"] }

# Async runtime — rmcp requires tokio. rt-multi-thread for blocking pipeline work.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }

# Bench harness — grafy-bench only
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"


[profile.bench]
lto = "thin"
debug = true

# PGO instrumented build — used by `make pgo` phase 1 only.
# Do not use for regular releases; standard [profile.release] is unaffected.
[profile.release-pgo]
inherits = "release"
# strip must be off so the instrumentation runtime can write raw profiles.
strip = false
