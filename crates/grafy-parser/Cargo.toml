[package]
name = "grafy-parser"
description = "Thread-safe tree-sitter parser pool for Grafy. Reusable."
readme = "README.md"
keywords = ["tree-sitter", "parser", "code-intelligence", "grafy"]
categories = ["parser-implementations", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-cpp = { workspace = true }
tree-sitter-c-sharp = { workspace = true }
tree-sitter-php = { workspace = true }
tree-sitter-scala = { workspace = true }
tree-sitter-lua = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[lints.clippy]
all = "warn"
# Send/Sync safety — keep parser pool internals from leaking Node<'a>.
