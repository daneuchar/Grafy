[package]
name = "grafy"
description = "Polyglot, LLM-free code-intelligence engine. Drop-in alternative to codebase-memory-mcp."
readme = "README.md"
keywords = ["code-intelligence", "mcp", "tree-sitter", "stack-graphs", "lsp"]
categories = ["development-tools", "command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
# Enable test-dispatch helper on GrafyServer (used by parity_schemas / parity_sessions tests).
# Activated automatically for `cargo test` via [[test]] harness — do not enable in production builds.
testing = []

[lib]
name = "grafy"
path = "src/lib.rs"

[[bin]]
name = "grafy"
path = "src/main.rs"

[dependencies]
grafy-parser = { path = "../grafy-parser", version = "0.1.0" }
grafy-stackgraphs = { path = "../grafy-stackgraphs", version = "0.1.0" }

# Tree-sitter grammars — needed by pass1 to compile per-file queries.
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-cpp = { workspace = true }
tree-sitter-c-sharp = { workspace = true }
tree-sitter-php = { workspace = true }
tree-sitter-scala = { workspace = true }
tree-sitter-lua = { workspace = true }

# Concurrency
rayon = { workspace = true }
crossbeam-channel = { workspace = true }
dashmap = { workspace = true }

# Storage
redb = { workspace = true }
postcard = { workspace = true }

# FS walking + hashing
ignore = { workspace = true }
blake3 = { workspace = true }

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

# Serde
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }

# MCP server — M1 W5
rmcp = { workspace = true }
tokio = { workspace = true }

# Faster allocator
mimalloc = { workspace = true }

# SCIP ingest — M2 W2. Reads `.scip` protobuf output from Sourcegraph indexers
# (scip-python, scip-typescript, scip-go, scip-java, scip-clang, scip-ruby,
# rust-analyzer scip) and merges as `EdgeKind::Scip` edges. Version pin must
# match grafy-bench's `scip` (= 0.7.1) so `cargo tree` resolves one copy.
scip = "0.7.1"
protobuf = "=3.7.2"

[dev-dependencies]
tempfile = { workspace = true }
redb = { workspace = true }
postcard = { workspace = true }
jsonschema = "0.46"

[[test]]
name = "parity_schemas"
path = "tests/parity_schemas.rs"
required-features = ["testing"]

[[test]]
name = "parity_sessions"
path = "tests/parity_sessions.rs"
required-features = ["testing"]

[lints.clippy]
all = "warn"
